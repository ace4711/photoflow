name: PhotoFlow
options:
  bundleIdPrefix: com.photoflow
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # PhotoFlow is an almost entirely single-window, UI-driven personal tool —
    # nearly every type (ObservableObject state, services) is already meant to
    # run on the main actor. A fully manual Swift 6 migration (annotating each
    # of the ~10 singletons + all their call sites) produced a long tail of
    # mechanical "not concurrency-safe" errors with no behavioral value, so we
    # use Xcode 27's default-actor-isolation escape hatch instead (see
    # FORBATTRINGAR.md, Fas 2b) — verified present in this toolchain's
    # Swift.xcspec before use. The few real background-work spots (Process
    # execution in ProcessRunner.swift) already isolate explicitly via
    # `nonisolated`/a locked box, so this doesn't hide any actual data races.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES

targets:
  PhotoFlow:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photoflow.app
        PRODUCT_NAME: PhotoFlow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
        # Signera med riktig utvecklaridentitet i stället för ad hoc ("-").
        # macOS kopplar TCC-behörigheter (kalender, mikrofon, taligenkänning)
        # till appens kodsignatur: en ad hoc-signerad app får ny identitet vid
        # VARJE ombygge, så systemet frågade om kalenderåtkomst på nytt varenda
        # gång. Med en stabil identitet (samma team + bundle-id) minns systemet
        # svaret mellan ombyggen.
        # OBS: ad hoc-signering ("-") är orsaken till att systemet frågar om
        # kalender-/mikrofonbehörighet på nytt efter varje ombygge — macOS
        # kopplar TCC-behörigheter till kodsignaturen, och ad hoc ger appen en
        # ny identitet varje gång binären ändras.
        #
        # Permanent fix: signera med en stabil identitet. Maskinens två
        # "Apple Development"-certifikat gick ut i april/maj 2025. Förnya ett i
        # Xcode (Inställningar → Accounts → Manage Certificates → + → Apple
        # Development) och ersätt raderna nedan med:
        #   CODE_SIGN_IDENTITY: "Apple Development"
        #   CODE_SIGN_STYLE: Automatic
        #   DEVELOPMENT_TEAM: <team-id, t.ex. C79MJBJHSF eller 64W55596GY>
        # Kör sedan `xcodegen generate`. Då minns systemet svaret mellan byggen.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    # Fas 7: bytt från GENERATE_INFOPLIST_FILE + INFOPLIST_KEY_*-inställningar
    # till en explicit genererad Info.plist (info.path/properties) — behövs
    # för att kunna deklarera UTImportedTypeDeclarations/CFBundleDocumentTypes
    # (arrayer av dictionaries, som INFOPLIST_KEY_*-mekanismen inte uttrycker)
    # för fältanteckningsformatet `.photoflownotes` från PhotoFlowField (iOS).
    # Verifierat i ett scratchpad-XcodeGen-projekt innan användning här att
    # `info.path` + `info.properties` faktiskt genererar en Info.plist med
    # dessa nycklar och sätter INFOPLIST_FILE åt en (i stället för
    # GENERATE_INFOPLIST_FILE), så alla tidigare INFOPLIST_KEY_*-värden
    # migrerades hit oförändrade i innehåll.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PhotoFlow
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: "public.app-category.photography"
        NSCalendarsUsageDescription: "PhotoFlow läser din kalender för att matcha fotograferingar med bokningsadresser och organisera filerna i adressmappar."
        NSMicrophoneUsageDescription: "PhotoFlow använder mikrofonen för att spela in röstanteckningar till bilder."
        NSSpeechRecognitionUsageDescription: "PhotoFlow använder taligenkänning för att transkribera röstanteckningar till text."
        # Fas 7: PhotoFlowField (iOS) exporterar den här typen (den skapar
        # filerna) — PhotoFlow (macOS) bara importerar/konsumerar den.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.photoflow.fieldnotes
            UTTypeDescription: "PhotoFlow fältanteckningar"
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [photoflownotes]
        CFBundleDocumentTypes:
          - CFBundleTypeName: "PhotoFlow fältanteckningar"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.photoflow.fieldnotes]
    # Fas 3f: utan en explicit länkad AppIntents.framework-dependency hoppar
    # Xcodes build-system över App Intents-metadataextraktionen ("Metadata
    # extraction skipped, no AppIntents.framework dependency found") även om
    # koden importerar och använder `AppIntents` — extraktionen letar efter
    # en riktig länknings-dependency, inte bara ett `import`.
    dependencies:
      - sdk: AppIntents.framework
    entitlements:
      path: PhotoFlow.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true

  PhotoFlowField:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/Shared
      - SourcesField
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photoflow.field
        PRODUCT_NAME: "PhotoFlow Fält"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Fas 7: inget riktigt signeringsteam finns för det här projektet —
        # appen är avsiktligt begränsad till Simulator (se FORBATTRINGAR.md).
        # Samma ad hoc-signeringsinställning som PhotoFlow (macOS)-målet ovan,
        # så `xcodebuild ... -destination 'generic/platform=iOS Simulator'
        # build` går igenom utan ett Apple-utvecklarkonto/-team.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: InfoField.plist
      properties:
        CFBundleDisplayName: "PhotoFlow Fält"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        NSLocationWhenInUseUsageDescription: "PhotoFlow Fält använder din plats för att spara var varje fältanteckning gjordes, så Mac-appen kan sätta rätt position på bilderna."
        NSMicrophoneUsageDescription: "PhotoFlow Fält använder mikrofonen för att spela in dikterade fältanteckningar."
        NSSpeechRecognitionUsageDescription: "PhotoFlow Fält använder taligenkänning för att transkribera dikterade fältanteckningar till text."
        # Fas 7: PhotoFlowField äger/exporterar den här typen — se motsvarande
        # UTImportedTypeDeclarations-kommentar i PhotoFlow (macOS)-målet ovan.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.photoflow.fieldnotes
            UTTypeDescription: "PhotoFlow fältanteckningar"
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [photoflownotes]
        CFBundleDocumentTypes:
          - CFBundleTypeName: "PhotoFlow fältanteckningar"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.photoflow.fieldnotes]
        # Fas 8: samma varningstystnad som macOS-målet ovan — appen skapar/
        # exporterar sina egna .photoflownotes-filer men redigerar aldrig en
        # öppnad fil "in place".
        LSSupportsOpeningDocumentsInPlace: false

  PhotoFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: PhotoFlow

schemes:
  PhotoFlow:
    build:
      targets:
        PhotoFlow: all
        PhotoFlowTests: [test]
    test:
      targets:
        - PhotoFlowTests
  PhotoFlowField:
    build:
      targets:
        PhotoFlowField: all
    run:
      config: Debug
