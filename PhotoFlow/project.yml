name: PhotoFlow
options:
  bundleIdPrefix: com.photoflow
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # PhotoFlow is an almost entirely single-window, UI-driven personal tool —
    # nearly every type (ObservableObject state, services) is already meant to
    # run on the main actor. A fully manual Swift 6 migration (annotating each
    # of the ~10 singletons + all their call sites) produced a long tail of
    # mechanical "not concurrency-safe" errors with no behavioral value, so we
    # use Xcode 27's default-actor-isolation escape hatch instead (see
    # FORBATTRINGAR.md, Fas 2b) — verified present in this toolchain's
    # Swift.xcspec before use. The few real background-work spots (Process
    # execution in ProcessRunner.swift) already isolate explicitly via
    # `nonisolated`/a locked box, so this doesn't hide any actual data races.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES

targets:
  PhotoFlow:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photoflow.app
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: PhotoFlow
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: PhotoFlow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
        INFOPLIST_KEY_NSCalendarsUsageDescription: "PhotoFlow läser din kalender för att matcha fotograferingar med bokningsadresser och organisera filerna i adressmappar."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PhotoFlow använder mikrofonen för att spela in röstanteckningar till bilder."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "PhotoFlow använder taligenkänning för att transkribera röstanteckningar till text."
    entitlements:
      path: PhotoFlow.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true

  PhotoFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: PhotoFlow

schemes:
  PhotoFlow:
    build:
      targets:
        PhotoFlow: all
        PhotoFlowTests: [test]
    test:
      targets:
        - PhotoFlowTests
