# Mac (~/Library/Application Support/sops/age/keys.txt) kan dekryptera utan ny nyckel.
# Den privata nyckeln finns aldrig på server3: deploy.yml dekrypterar lokalt på Macen.
#
#   kryptera:   sops -e --output secrets/film.sops.env /väg/till/.env
#   dekryptera: sops -d secrets/film.sops.env
#   redigera:   sops secrets/film.sops.env
creation_rules:
  - path_regex: secrets/.*\.sops\.env$
